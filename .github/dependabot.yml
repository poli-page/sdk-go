version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # The SDK currently has zero runtime deps (stdlib only). The group
    # below catches anything we add later, plus indirect deps from any
    # future dev tooling pulled into go.mod.
    groups:
      gomod:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      # Daily: a new API contract version (poli-page/api-contract) arrives as a PR at once.
      interval: daily
    labels:
      - dependencies
      - ci
    # Dependabot waits 3 days after a release by default. The API contract is
    # exempt so its PR arrives the next day; other actions keep the wait.
    cooldown:
      default-days: 3
      exclude:
        - "poli-page/api-contract"
    groups:
      # The API contract gets PRs of its own: a contract bump shows what the
      # API change breaks, never mixed with other action bumps.
      api-contract:
        patterns:
          - "poli-page/api-contract"
      actions:
        patterns:
          - "*"
        exclude-patterns:
          - "poli-page/api-contract"
