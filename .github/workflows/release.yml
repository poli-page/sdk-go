name: Release

# Tag-triggered release. A Go module has no upload step: pushing the vX.Y.Z
# tag publishes the module, and proxy.golang.org indexes it on the first
# request for that version. This workflow cannot hold a tag back, so the gate
# is scripts/release.sh, run before the tag is pushed; the verify job re-runs
# its version checks on the tag itself, so a mismatching tag shows up red at
# once and can be retracted before anyone depends on it. When verify is green,
# the release job creates the GitHub Release, with the CHANGELOG section as
# its notes.
#
# The full test matrix runs on the same push: ci.yml triggers on every push,
# tags included.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*' # prereleases (e.g. v0.14.0-rc.1)

permissions:
  contents: read

jobs:
  verify:
    name: Version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      # The module version is the tag, but the User-Agent reports
      # internal/version.Version: a mismatch means the release commit forgot
      # to bump the constant.
      - name: Version constant matches tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          declared="$(grep -oE '"[^"]*"' internal/version/version.go | tr -d '"')"
          if [ "$tag" != "$declared" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match internal/version.Version ($declared)"
            exit 1
          fi
          echo "Tag matches internal/version.Version: $declared"

      - name: CHANGELOG has the release section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qF "## [${version}] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}] - YYYY-MM-DD' section"
            exit 1
          fi
          echo "CHANGELOG.md has the ${version} section"

      # The SDK shares its major.minor with the Poli Page API: a release X.Y.z
      # must pass the API contract X.Y. The script reads the contract commit
      # ci.yml pins and requires a stable contract tag vX.Y.Z on it with the
      # tag's major.minor.
      - name: Pinned API contract matches the tag's major.minor
        run: ./scripts/check-contract-version.sh "${GITHUB_REF_NAME}"

  release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      # Pull the matching CHANGELOG section for the release body. Falls back to
      # a pointer if the section is absent so the release never fails on notes.
      - name: Extract CHANGELOG section
        id: changelog
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && /^## \[/             { exit }
            capture                         { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "_See [CHANGELOG.md](CHANGELOG.md) for details._" > "$notes"
          fi
          echo "notes_file=$notes" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            "${prerelease[@]}"
